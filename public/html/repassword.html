<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../vendor/bootstrap.min.css" />
    <link rel="stylesheet" href="../css/styles.css" />
    <title>Reset Password - Bonsai Mori</title>
  </head>
  <body>
    <div class="container py-5 mt-5">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="text-center mb-4">
            <img src="../assets/icon-bonsai.png" width="56" height="56" alt="Bonsai Mori" class="mb-2" />
            <h2 class="contact-title">Set New Password</h2>
            <p class="contact-subtitle">Create a new password for your Bonsai Mori account.</p>
          </div>

          <div class="contact-card">
            <form id="resetPasswordForm">
              <div class="mb-4">
                <label for="newPassword" class="form-label">New Password</label>
                <input
                  type="password"
                  class="form-control"
                  id="newPassword"
                  placeholder="At least 8 characters (letters & numbers)"
                  required
                />
                <div class="form-text text-muted small">
                  The password must be at least 8 characters long and contain English letters and numbers.
                </div>
              </div>

              <div class="mb-4">
                <label for="confirmNewPassword" class="form-label">Confirm New Password</label>
                <input
                  type="password"
                  class="form-control"
                  id="confirmNewPassword"
                  placeholder="Confirm your new password"
                  required
                />
              </div>

              <button type="submit" class="btn contact-btn w-100">
                Update Password
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="../vendor/bootstrap.bundle.min.js"></script>
    <script src="../js/auth.js"></script>
  </body>
</html>
