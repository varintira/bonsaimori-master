<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../vendor/bootstrap.min.css" />
    <link rel="stylesheet" href="../css/styles.css" />
    <title>Forgot Password - Bonsai Mori</title>
  </head>
  <body>
    <div class="container py-5 mt-5">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="text-center mb-4">
            <img src="../assets/icon-bonsai.png" width="56" height="56" alt="Bonsai Mori" class="mb-2" />
            <h2 class="contact-title">Forgot Password</h2>
            <p class="contact-subtitle">Enter your registered email to receive a password reset link.</p>
          </div>

          <div class="contact-card">
            <form id="forgotPasswordForm">
              <div class="mb-4">
                <label for="forgotEmail" class="form-label">Email Address</label>
                <input
                  type="email"
                  class="form-control"
                  id="forgotEmail"
                  placeholder="Enter your email"
                  required
                />
              </div>

              <button type="submit" id="forgotBtn" class="btn contact-btn w-100">
                Send Reset Link
              </button>
            </form>

            <div class="text-center mt-4">
              <p class="auth-switch-text mb-0">
                Remember your password? <a href="signIn.html" class="auth-link">Sign In</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="../vendor/bootstrap.bundle.min.js"></script>
    <script src="../js/auth.js"></script>
  </body>
</html>
