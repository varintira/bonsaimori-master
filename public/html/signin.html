<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../vendor/bootstrap.min.css">
    <link rel="stylesheet" href="../css/styles.css">
    <title>Sign In - Bonsai Mori</title>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-body sticky-top border-bottom">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                <img src="../assets/icon-bonsai.png" width="44" height="44" alt="Bonsai Mori">
                <span><strong class="d-block lh-1">Bonsai Mori</strong></span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-3">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="team.html">Team</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                    <li class="nav-item"><a class="nav-link active" href="signin.html">Sign In</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Sign In Section -->
    <div class="container py-5 mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-5">
                
                <div class="text-center mb-4">
                    <h1 class="auth-title">Welcome back</h1>
                    <p class="auth-subtitle">Sign in to your Bonsai Mori account</p>
                </div>

                <div class="contact-card">
                    <div id="authAlertBox"></div>
                    <form id="signinForm">
                        <div class="mb-4">
                            <label for="signinEmail" class="form-label">Email</label>
                            <input type="email" class="form-control" id="signinEmail" placeholder="Enter your email" required>
                        </div>

                        <div class="mb-4">
                            <label for="signinPassword" class="form-label">Password</label>
                            <input type="password" class="form-control" id="signinPassword" placeholder="Enter your password" required>
                            <div class="d-flex justify-content-end mt-2">
                                <a href="forgot_password.html" class="auth-link small">Forgot Password?</a>
                            </div>
                        </div>

                        <button type="submit" class="btn contact-btn">Sign In</button>
                    </form>

                    <div class="text-center mt-4">
                        <p class="auth-switch-text mb-0">
                            Don't have an account? <a href="signup.html" class="auth-link">Sign Up</a>
                        </p>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-body-tertiary py-4 mt-5">
        <div class="container d-flex flex-column flex-lg-row align-items-center justify-content-between gap-3">
            <div class="text-body-secondary small text-center text-lg-start">
                © 2024 Bonsai Mori. All rights reserved.
            </div>
            <ul class="nav gap-3 justify-content-center">
                <li class="nav-item"><a class="nav-link text-body-secondary" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link text-body-secondary" href="about.html">About</a></li>
                <li class="nav-item"><a class="nav-link text-body-secondary" href="team.html">Team</a></li>
                <li class="nav-item"><a class="nav-link text-body-secondary" href="contact.html">Contact</a></li>
            </ul>
        </div>
    </footer>

    <script src="../vendor/bootstrap.bundle.min.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
